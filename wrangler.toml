name = "perch"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Needed by the TCP probe. Without it `cloudflare:sockets` is not there and
# every tcp monitor fails in a way that looks like the service is down.
compatibility_flags = ["nodejs_compat"]

# No workers.dev address. The read API is served from a name we own, which is
# the same reason the fonts on the site it feeds are self-hosted: one origin,
# and no reader handed to somebody else's domain to find out whether we are up.
#
# Cloudflare still requires the account to have registered a workers.dev
# subdomain before it will accept a cron schedule, even when nothing is
# published there. Registering one is a prerequisite, not a destination.
workers_dev = false

[[routes]]
pattern = "perch.cordice.org"
custom_domain = true

# Every five minutes, which is what the tools this replaces do and therefore
# what makes a fair comparison while all three are running. Cron will go no
# finer than a minute, and a minute is rarely worth four times the writes.
# The built status page, served from the same name as the API it reads.
#
# Assets are matched first; anything that is not a file falls through to the
# worker, which is how /api/* still reaches code. One host means the page can
# ask for "/api/summary" with no origin in front of it, and moving Perch to a
# domain of its own is then a change to one name and nothing else.
[assets]
directory = "./site/dist"

[triggers]
crons = ["*/5 * * * *"]

[vars]
# Recorded against every check. One vantage point today; when there are more,
# each deployment names its own and the database already has the column.
PERCH_REGION = "auto"
PERCH_RETENTION_DAYS = "90"

[[d1_databases]]
binding = "DB"
database_name = "perch"
# From `wrangler d1 create perch`. Yours will differ.
database_id = "6cb1bee4-6dfa-481a-8222-f6fcd0bddb0a"
